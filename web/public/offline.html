<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Jarvis is offline</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
      }
      p {
        color: #475569;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        border-radius: 0.6rem;
        background: #4f46e5;
        color: white;
        padding: 0.7rem 1rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Jarvis needs an internet connection to load your account and keep your data up to date.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
