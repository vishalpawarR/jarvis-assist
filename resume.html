<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Jarvis resume</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; font: 14px system-ui, sans-serif; }
      header { height: 48px; display: flex; align-items: center; padding: 0 16px; color: #fff; background: #252642; }
      #resume { width: 100%; height: calc(100% - 48px); border: 0; }
      #toolbar { min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 16px; }
      #toolbar button { padding: 7px 10px; border: 1px solid #dfe2ee; border-radius: 8px; background: #f7f8fc; cursor: pointer; }
      #message { padding: 0 16px; color: #3931a3; }
    </style>
  </head>
  <body>
    <header>Jarvis · Your saved resume</header>
    <div id="toolbar">
      <button id="save-show-folder" type="button" disabled>Save a copy to Downloads &amp; show folder</button>
      <span id="file-name"></span>
    </div>
    <p id="message" role="status">Opening your locally saved PDF…</p>
    <div id="viewer"></div>
    <script src="resume.js"></script>
  </body>
</html>
